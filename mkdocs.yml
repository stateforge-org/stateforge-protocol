site_name: StateForge Protocol
site_description: Wire-contract documentation for StateForge Protocol.
site_author: StateForge
copyright: Copyright &copy; StateForge

strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top

nav:
  - Overview: index.md
  - SFP procedures:
      - Procedure map: procedures/index.md
      - Endpoint discovery and channel establishment: procedures/endpoint-discovery.md
      - Handshake and version negotiation: bootstrap.md
      - Provider manifest exchange: procedures/provider-manifest.md
      - Health and availability monitoring: procedures/health.md
      - Capability assessment: procedures/capability-assessment.md
      - Trigger publication and acknowledgement: procedures/triggers.md
      - Operation admission and idempotency: procedures/operation-admission.md
      - Backup preparation: procedures/backup-preparation.md
      - Disaster-recovery execution: procedures/disaster-recovery.md
      - Progress, results, and cancellation: procedures/progress-results-cancellation.md
      - Disconnection and recovery: procedures/disconnection-recovery.md
  - Generated Python contracts: reference/python-contracts.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
