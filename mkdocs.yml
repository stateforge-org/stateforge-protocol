site_name: StateForge Protocol
site_description: Wire-contract documentation for StateForge Protocol.
site_author: StateForge
copyright: Copyright &copy; StateForge

strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top

nav:
  - Overview: index.md
  - Bootstrap contract: bootstrap.md
  - Generated Python contracts: reference/python-contracts.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - tables

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
