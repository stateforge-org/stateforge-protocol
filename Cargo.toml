[workspace]
members = [
    "crates/protocol-core",
    "crates/python-extension",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/stateforge-org/stateforge-protocol"

[workspace.dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", features = ["transport"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
