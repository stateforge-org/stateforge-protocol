syntax = "proto3";

package stateforge.sfp.manifest.v1;

import "google/protobuf/struct.proto";

// ManifestService exposes a complete declaration of the running Provider after
// bootstrap has selected SFP 1.0. It shares the Agent-established local channel.
// This read-only service does not admit operations or change Provider state.
service ManifestService {
  // GetManifest selects the highest mutually supported manifest schema version.
  // See docs/v0.1.0/procedures/provider-manifest.md for validation, errors and retries.
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);
}

// GetManifestRequest binds the read to the session confirmed by Handshake.
// Empty/default fields are invalid, not wildcards. At most 32 distinct positive
// schema versions may be offered; order conveys no preference. Schema 1 is the
// only manifest schema defined by this package today.
message GetManifestRequest {
  // Canonical lowercase UUIDv4 of the installation, copied from Handshake.
  string expected_provider_instance_id = 1;
  // Positive endpoint generation copied from Handshake, never a process ID.
  uint64 expected_endpoint_generation = 2;
  repeated uint32 supported_manifest_schema_versions = 3;
  // Required opaque identifier copied unchanged from HandshakeResponse.session_id.
  // 1-255 Unicode code points, case-sensitive; do not normalize or parse as UUID.
  // Must name a known, active negotiated session for this instance/generation.
  // Empty/malformed is INVALID_ARGUMENT; unknown/inactive/mismatched is
  // FAILED_PRECONDITION. Endpoint identity alone never proves negotiation.
  string expected_session_id = 4;
}

// GetManifestResponse is one atomic snapshot. A successful response always
// contains a complete manifest; there is no implicit not-modified response.
// Schema validation and revision acceptance are independent of gRPC health.
message GetManifestResponse {
  // Must equal the request's expected identity and the negotiated session.
  string provider_instance_id = 1;
  // Must equal the request's expected generation and the negotiated session.
  uint64 endpoint_generation = 2;
  // Highest common schema version, not an SFP or implementation version.
  uint32 manifest_schema_version = 3;
  // "sha256:" plus 64 lowercase hex digits. The normative preimage is RFC 8785
  // canonical JSON of {manifest, manifestSchemaVersion, providerInstanceId}.
  // ProtoJSON defaults are emitted; generation and session ID are excluded.
  // Protobuf deterministic serialization is NOT a canonical hashing format.
  string manifest_revision = 4;
  // Required. At most 1 MiB of canonical JSON for the revision preimage.
  ProviderManifest manifest = 5;
  // Echo the validated request's expected_session_id, never a global latest ID.
  // The Agent must match it to both the request and its current session before
  // accepting or reusing a cached declaration. Not part of manifest_revision.
  string session_id = 6;
  // Optional declarative presentation snapshot. Operational JSON Schemas
  // remain sufficient to render every declared capability when this field is
  // absent, unsupported or rejected. Presentation never changes execution
  // semantics and is not part of manifest_revision.
  ProviderPresentation presentation = 7;
  // Present exactly when presentation is present. "sha256:" plus 64 lowercase
  // hex digits over the canonical presentation preimage defined by this
  // package. Session ID and endpoint generation are excluded.
  optional string presentation_revision = 8;
}

// ProviderManifest describes implementation-wide declarations, not configured
// customer resources. It contains no credentials, configured values, component
// bindings or admission decisions. The packaged manifest.schema.json validates
// its schema-1 ProtoJSON representation and embedded JSON Schemas.
message ProviderManifest {
  // Author-declared dotted lowercase type identity, for example stateforge.git.
  string provider_identity = 1;
  // SemVer 2.0.0 of the running implementation, independent of wire versions.
  string implementation_version = 2;
  string display_name = 3;
  // Keys are extensible versioned identifiers, e.g.
  // stateforge.git/reference.resolve@1. They are not a closed operation enum.
  map<string, OperationDeclaration> operations = 4;
  // Keys identify declared requirements, e.g. runtime.python or executable.git.
  map<string, RuntimeRequirement> runtime_requirements = 6;
  // Explicit supported OS/architecture pairs. Empty does not mean universal.
  repeated PlatformCompatibility platforms = 7;
  // Required Draft 2020-12 object schema, with writeOnly secret-bearing inputs.
  // Values describe configuration shape, never an actual configuration.
  google.protobuf.Struct configuration_schema = 8;
  // Keys are versioned trigger identifiers. Empty means no trigger support.
  map<string, TriggerDeclaration> triggers = 9;
}

// OperationDeclaration describes an available handler and explicit compliance
// claims. Declaring a role is not proof of compliance; consumers validate claims
// against the referenced profile. No StartOperation or execution behavior is
// introduced by this message.
message OperationDeclaration {
  // Required Draft 2020-12 object schemas for typed input and terminal result.
  google.protobuf.Struct input_schema = 1;
  // The sole declaration of terminal result shape for this versioned operation.
  // Recognized compliance roles require the exact schemas of their profile.
  google.protobuf.Struct result_schema = 2;
  // Zero or more distinct claims that this operation implements versioned
  // semantic/compliance profiles, e.g.
  // example.vendor.profile.v1.read_only. SFP transports these extensible
  // claims without assigning application-specific meaning to them. Empty
  // means no profile claim. Never infer a role from the operation identifier
  // or a Python method name.
  repeated string implements = 3;
}

// RuntimeRequirement describes a dependency or prerequisite without transferring
// installed state, secrets or commands to execute. Version constraint syntax is
// owned by the named requirement; this contract does not prescribe an evaluator.
message RuntimeRequirement {
  string description = 1;
  // Empty means that the declaration imposes no version constraint.
  string version_constraint = 2;
}

// PlatformCompatibility is one supported pair, not a Cartesian product.
// Values are lowercase identifiers such as linux and x86_64; no wildcards.
message PlatformCompatibility {
  string operating_system = 1;
  string architecture = 2;
}

// TriggerDeclaration describes a Provider-originated event's payload. Stream,
// acknowledgement and delivery semantics belong to a later SFP procedure.
message TriggerDeclaration {
  // Required Draft 2020-12 object schema, never an event instance.
  google.protobuf.Struct payload_schema = 1;
}

// ProviderPresentation is an optional, independently revised visual overlay
// on an accepted ProviderManifest. Maps use the exact operation and trigger
// identifiers declared by that manifest. Presentation cannot add, remove or
// redefine capabilities or their JSON Schemas.
message ProviderPresentation {
  // Presentation document version. Version 1 is defined by this package.
  uint32 presentation_schema_version = 1;
  // Optional Provider-level description, branding and visual groups.
  ProviderView provider = 2;
  // Optional overlays keyed by declared operation identifier.
  map<string, OperationView> operations = 3;
  // Optional overlays keyed by declared trigger identifier.
  map<string, TriggerView> triggers = 4;
  // Embedded content-addressed visuals keyed by their sha256 digest.
  map<string, PresentationAsset> assets = 5;
}

// ProviderView describes the Provider itself. Group order is declaration order;
// operations and triggers opt into a group by ID, and ungrouped capabilities
// remain visible through schema-derived rendering.
message ProviderView {
  string summary = 1;
  string description = 2;
  string icon_asset_digest = 3;
  string banner_asset_digest = 4;
  repeated CapabilityGroup groups = 5;
}

// CapabilityGroup supplies optional visual organization without duplicating
// operation or trigger membership.
message CapabilityGroup {
  string id = 1;
  string label = 2;
  string description = 3;
  string icon_asset_digest = 4;
}

// OperationView supplies labels and schema-addressed overlays for one declared
// operation. Empty group_id means that the operation is not grouped.
message OperationView {
  string label = 1;
  string summary = 2;
  string description = 3;
  string icon_asset_digest = 4;
  string group_id = 5;
  SchemaView input = 6;
  SchemaView result = 7;
}

// TriggerView supplies labels and a schema-addressed overlay for one declared
// trigger. Empty group_id means that the trigger is not grouped.
message TriggerView {
  string label = 1;
  string summary = 2;
  string description = 3;
  string icon_asset_digest = 4;
  string group_id = 5;
  SchemaView payload = 6;
}

// SchemaView adds optional ordering, grouping and compatible render hints to a
// JSON Schema. Every pointer addresses a field schema in the corresponding
// operation input/result or trigger payload schema. Unmentioned fields remain
// visible and retain their schema-defined semantics.
message SchemaView {
  repeated string field_order = 1;
  repeated FieldGroup groups = 2;
  map<string, FieldView> fields = 3;
}

// FieldGroup visually groups schema fields. Field pointers may appear in at
// most one group and group order is declaration order.
message FieldGroup {
  string id = 1;
  string label = 2;
  string description = 3;
  repeated string fields = 4;
}

// FieldView supplies optional text and compatible render preferences for one
// schema field. It cannot change validation, requiredness or visibility.
message FieldView {
  string label = 1;
  string help_text = 2;
  string placeholder = 3;
  string unit = 4;
  InputWidget widget = 5;
  DisplayStyle display = 6;
}

// InputWidget selects an optional input control compatible with a field's
// authoritative JSON Schema. Unspecified delegates entirely to the renderer.
enum InputWidget {
  INPUT_WIDGET_UNSPECIFIED = 0;
  INPUT_WIDGET_TEXT = 1;
  INPUT_WIDGET_MULTILINE = 2;
  INPUT_WIDGET_SECRET = 3;
  INPUT_WIDGET_NUMBER = 4;
  INPUT_WIDGET_SLIDER = 5;
  INPUT_WIDGET_CHECKBOX = 6;
  INPUT_WIDGET_SELECT = 7;
  INPUT_WIDGET_RADIO = 8;
  INPUT_WIDGET_DATE_TIME = 9;
  INPUT_WIDGET_JSON = 10;
}

// DisplayStyle selects an optional read-only presentation compatible with a
// field's authoritative JSON Schema. Unspecified delegates to the renderer.
enum DisplayStyle {
  DISPLAY_STYLE_UNSPECIFIED = 0;
  DISPLAY_STYLE_TEXT = 1;
  DISPLAY_STYLE_CODE = 2;
  DISPLAY_STYLE_JSON = 3;
  DISPLAY_STYLE_TABLE = 4;
  DISPLAY_STYLE_BADGE = 5;
  DISPLAY_STYLE_METRIC = 6;
  DISPLAY_STYLE_DATE_TIME = 7;
}

// PresentationAsset is embedded, content-addressed media. The map key is the
// sha256 digest of content. Remote URLs and filesystem paths have no wire field.
message PresentationAsset {
  string media_type = 1;
  bytes content = 2;
  uint32 width = 3;
  uint32 height = 4;
  string alt_text = 5;
}
