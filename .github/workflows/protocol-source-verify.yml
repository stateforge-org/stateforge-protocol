name: Protocol / Source verification

on:
  workflow_call:
    inputs:
      breaking-against:
        description: Buf Git source used for compatibility comparison.
        required: false
        type: string
        default: .git#branch=origin/mvp/implementation
      evidence-name:
        description: Name used to upload source-verification evidence.
        required: false
        type: string
        default: stateforge-protocol-source-evidence
      retention-days:
        description: Number of days to retain source-verification evidence.
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  verify:
    name: Validate source contracts and package quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.73.0"

      - name: Install development dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            --group dev \
            --group docs \
            .

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          actionlint_directory="${RUNNER_TEMP}/actionlint"
          mkdir -p "${actionlint_directory}"
          GOBIN="${actionlint_directory}" go install \
            "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "${actionlint_directory}" >> "${GITHUB_PATH}"

      - name: Validate CI metadata
        shell: bash
        run: actionlint -color

      - name: Validate Protocol contracts
        uses: ./.github/actions/contracts/validate
        with:
          breaking-against: ${{ inputs.breaking-against }}
          evidence-directory: evidence/source

      - name: Run Python and documentation checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/source
          {
            python -m ruff format --check .
            python -m ruff check .
            python -m mypy src
            python -m mkdocs build --strict
          } 2>&1 | tee evidence/source/quality.log

      - name: Collect bounded source evidence
        if: ${{ always() }}
        uses: ./.github/actions/evidence/collect
        with:
          stage: source-verification
          evidence-directory: evidence/source

      - name: Upload source-verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.evidence-name }}
          path: evidence/source
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
