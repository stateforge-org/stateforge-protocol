name: Protocol / Source verification

on:
  workflow_call:
    inputs:
      breaking-against:
        description: Buf Git source used for compatibility comparison.
        required: false
        type: string
        default: .git#branch=origin/mvp/implementation
      evidence-name:
        description: Name used to upload source-verification evidence.
        required: false
        type: string
        default: stateforge-protocol-source-evidence
      retention-days:
        description: Number of days to retain source-verification evidence.
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  native-wheel:
    name: Native Python wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build, install, and verify wheel
        shell: bash
        run: |
          set -euo pipefail
          temp_root="${RUNNER_TEMP}"
          workspace="${GITHUB_WORKSPACE}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            temp_root="$(cygpath -u "${RUNNER_TEMP}")"
            workspace="$(cygpath -u "${GITHUB_WORKSPACE}")"
          fi
          python -m pip install --disable-pip-version-check --upgrade pip
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir dist .
          python -m venv "${temp_root}/protocol-wheel-venv"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            wheel_python="${temp_root}/protocol-wheel-venv/Scripts/python.exe"
          else
            wheel_python="${temp_root}/protocol-wheel-venv/bin/python"
          fi
          "${wheel_python}" -m pip install --disable-pip-version-check dist/stateforge_protocol-*.whl
          cd "${temp_root}"
          "${wheel_python}" -I "${workspace}/scripts/ci/verify_installed.py" \
            --expected-version "${expected_version}" \
            --workspace "${workspace}" \
            --fixture-root "${workspace}/tests/fixtures"

  verify:
    name: Validate source contracts and package quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Verify dependency lock
        run: uv lock --check --python "3.13"

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.73.0"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable

      - name: Install development dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            --group dev \
            --group docs \
            .

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          actionlint_directory="${RUNNER_TEMP}/actionlint"
          mkdir -p "${actionlint_directory}"
          GOBIN="${actionlint_directory}" go install \
            "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "${actionlint_directory}" >> "${GITHUB_PATH}"

      - name: Validate CI metadata
        shell: bash
        run: actionlint -color

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .
          collect: all
          online-audits: false
          persona: auditor
          min-severity: medium
          version: v1.30.1
          token: unused-offline
          advanced-security: false
          annotations: true

      - name: Validate Protocol contracts
        uses: ./.github/actions/contracts/validate
        with:
          breaking-against: ${{ inputs.breaking-against }}
          evidence-directory: evidence/source

      - name: Run Python and documentation checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/source
          {
            python -m ruff format --check .
            python -m ruff check .
            python -m mypy src
            python -m mkdocs build --strict
            cargo fmt --all -- --check
            cargo check --workspace --all-targets --locked
            cargo test --workspace --all-targets --locked
            cargo +1.85.0 test --workspace --all-targets --locked
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo doc --workspace --no-deps --locked
          } 2>&1 | tee evidence/source/quality.log

      - name: Collect bounded source evidence
        if: ${{ always() }}
        uses: ./.github/actions/evidence/collect
        with:
          stage: source-verification
          evidence-directory: evidence/source

      - name: Upload source-verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.evidence-name }}
          path: evidence/source
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
