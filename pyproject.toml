[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[project]
name = "stateforge-protocol"
version = "0.1.0"
description = "Protocol Buffer contracts for StateForge Protocol."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "StateForge" },
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "grpcio>=1.83",
    "grpcio-health-checking>=1.83",
    "jsonschema>=4.25,<5",
    "protobuf>=7.35.1",
    "referencing>=0.36,<1",
    "rfc8785>=0.1.4,<1",
]


[dependency-groups]
dev = [
    "build>=1.2",
    "grpcio-tools>=1.83",
    "mypy>=1.17",
    "mypy-protobuf==5.1.0",
    "pytest>=8.4",
    "pytest-asyncio>=1",
    "pytest-cov>=6.2",
    "pyyaml>=6.0",
    "ruff>=0.12",
    "types-grpcio",
    "types-grpcio-health-checking",
    "types-jsonschema",
    "types-pyyaml",
    "types-protobuf",
]
docs = [
    "mkdocstrings[python]>=0.30,<1",
    "stateforge-docs-theme @ git+https://github.com/stateforge-org/stateforge-docs.git@mvp/shared-documentation-theme",
]


[tool.uv]
environments = ["python_version == '3.13'"]


[tool.hatch.build.targets.wheel]
packages = [
    "src/stateforge_protocol",
]


[tool.hatch.build.targets.wheel.force-include]
"tests/fixtures" = "stateforge_protocol/fixtures"


[tool.hatch.build.targets.sdist]
include = [
    "/.github",
    "/LICENSE",
    "/README.md",
    "/buf.gen.yaml",
    "/buf.yaml",
    "/docs",
    "/examples",
    "/mkdocs.yml",
    "/proto",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
]
exclude = [
    "**/.DS_Store",
    "**/__pycache__",
    "**/*.pyc",
]


[tool.ruff]
target-version = "py311"
line-length = 79
src = ["src", "tests"]
extend-exclude = [
    "src/stateforge_protocol/sfp/**/*_pb2.py",
    "src/stateforge_protocol/sfp/**/*_pb2.pyi",
    "src/stateforge_protocol/sfp/**/*_pb2_grpc.py",
    "src/stateforge_protocol/sfp/**/*_pb2_grpc.pyi",
]


[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
    "W",
]

ignore = [
    "ANN401",
    "PLR0913",
    "W191",
    "E111",
    "E114",
    "E117",
    "D203",
    "D206",
    "D300",
]


[tool.ruff.lint.per-file-ignores]
"src/stateforge_protocol/sfp/**/*_pb2.py" = ["ALL"]
"src/stateforge_protocol/sfp/**/*_pb2.pyi" = ["ALL"]
"src/stateforge_protocol/sfp/**/*_pb2_grpc.py" = ["ALL"]
"tests/**/*.py" = ["ANN", "D", "S101"]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
docstring-code-format = true


[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["stateforge_protocol"]
pretty = true
show_error_codes = true
warn_unreachable = true
warn_unused_configs = true


[tool.pytest.ini_options]
minversion = "8.4"
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"


[tool.coverage.run]
branch = true
source = [
    "stateforge_protocol",
    "scripts.ci.audit_consumer",
    "scripts.ci.verify_consumer_protocol",
]
omit = [
    "*/sfp/*/v*/*_pb2.py",
    "*/sfp/*/v*/*_pb2_grpc.py",
]


[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
